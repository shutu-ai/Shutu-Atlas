# 复制为 atlas.toml 后按本机实际目录调整。不要把个人绝对路径写进源码。
[paths]
db = ".local/atlas.sqlite3"
gallery = ".local/gallery"
serena_workspaces = ".local/serena-workspaces"

[scan]
roots = ["D:/dev-projects"]
include_projects = []
exclude_projects = ["Shutu-Atlas"]
excluded_dirs = [".git", ".local", "node_modules", ".venv", "dist", "build", "coverage", "__pycache__", ".codegraph", ".go-cache", ".go-mod-cache", ".deploy-staging", "pytest-cache-files"]

[limits]
max_file_bytes = 512000
# The current D:\dev-projects inventory contains two legitimate source/UI
# projects with 23k–24k eligible files. Keep the cap explicit and bounded.
max_files_per_project = 30000
max_results = 50
max_snippet_lines = 12
max_chars = 8000
command_timeout_seconds = 8.0
changed_only_hash_mode = "stat"

