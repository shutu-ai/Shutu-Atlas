[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shutu-atlas"
version = "0.2.0"
description = "本地优先的跨项目代码与 UI 资产参考库"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Keep the default install offline-friendly; use the pinned requirements file
# for an explicitly approved official SDK/Serena verification environment.
integrations = ["mcp[cli]==2.2.0", "serena-agent==2.1.0", "uv==0.13.5"]

[project.scripts]
atlas = "shutu_atlas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/test_index.py", "tests/test_symbols_mcp.py", "tests/test_mcp_sdk_optional.py", "tests/test_serena_optional.py", "tests/test_gallery_frontend.py", "tests/test_skill_e2e.py"]
norecursedirs = ["fixtures", ".test-tmp", ".test-work"]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]

